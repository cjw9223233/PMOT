name: Daily market report and GitHub Pages

on:
  schedule:
    # 三個獨立喚醒機會；GitHub 排程仍可能延遲，不能當作準時保證。
    - cron: '0 8 * * *'
      timezone: Asia/Taipei
    - cron: '17 8 * * *'
      timezone: Asia/Taipei
    - cron: '37 8 * * *'
      timezone: Asia/Taipei
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pmot/**'
      - 'site/assets/**'
      - 'site/prompt.md'
      - 'site/data/reports.json'
      - '.github/workflows/daily-report.yml'
      - 'tests/**'

# build 到成功收據提交都序列化；補跑 checkout 時才能看到前次結果。
concurrency:
  group: pmot-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify market parsing and delivery safeguards
        run: python -m unittest discover -s tests -v
      - name: Read actual GitHub run timestamps
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/run.json"
          echo "RUN_CREATED_AT=$(jq -r .created_at "$RUNNER_TEMP/run.json")" >> "$GITHUB_ENV"
          echo "RUN_STARTED_AT=$(jq -r .run_started_at "$RUNNER_TEMP/run.json")" >> "$GITHUB_ENV"
      - name: Decide generate, retry deployment, or skip
        id: prepare
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m pmot.delivery prepare
      - name: Query fresh markets only when no report exists today
        id: query
        if: steps.prepare.outputs.action == 'generate'
        run: python -m pmot update
      - name: Record packaging time and save immutable report
        id: publish
        if: steps.prepare.outputs.action == 'deploy' || steps.query.outputs.changed == 'true'
        shell: bash
        run: |
          python -m pmot.delivery package
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site
          if ! git diff --cached --quiet; then
            git commit -m 'Update premarket report and delivery timing [skip ci]'
            git push origin HEAD:main
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Package website
        if: steps.publish.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Keep timing evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-timing-${{ github.run_attempt }}
          path: delivery-timing.json
          if-no-files-found: ignore
          retention-days: 30
  deploy:
    if: needs.build.outputs.changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # 單次最多等待 2 分鐘；暫時失敗在同次 run 再試一次。
      - name: Deploy website
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
      - name: Retry website deployment
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Save success receipt only after confirmed deployment
        # 任何部署失敗都不會走到這一步；之後補跑將重用相同報告。
        run: |
          python -m pmot.delivery confirm --timing site/data/delivery.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pmot/deployment.json
          git commit -m 'Record confirmed Pages deployment [skip ci]'
          git push origin HEAD:main
