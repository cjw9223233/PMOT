name: Daily market report and GitHub Pages

# 三種觸發：每日排程、人工補跑、main 指定路徑更新。
# 排程只是喚醒程式；是否正常交易日仍交給 Python 查核，08:30 不是保證完成時間。
on:
  schedule:
    - cron: '30 8 * * *'
      timezone: Asia/Taipei
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pmot/**'
      - 'site/assets/**'
      - 'site/prompt.md'
      - 'site/data/reports.json'
      - '.github/workflows/daily-report.yml'
      - 'tests/**'

# 同一時間只執行一個發布流程；不取消進行中的寫檔／提交／部署。
concurrency:
  group: pmot-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      # 只在這個 job 提升內容寫入權限，用來保存真實報告與清單。
      contents: write
    outputs:
      # 把步驟的 changed 提升成 job 輸出，讓 deploy 決定是否執行。
      changed: ${{ steps.report.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify market parsing and publication safeguards
        run: python -m unittest discover -s tests -v
      - name: Update on trading day, or rebuild after source changes
        id: report
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        # push 重建既有快照；每日／人工執行才查新行情。
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            python -m pmot build
          else
            python -m pmot update
          fi
      - name: Save immutable report and source audit
        # 正常休市會輸出 false；該次不提交、不封裝、不部署。
        if: steps.report.outputs.changed == 'true'
        # 自動提交避免形成 push 執行循環；人工 PR 不應仿照跳過檢查。
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site
          if ! git diff --cached --quiet; then
            git commit -m 'Update premarket report [skip ci]'
            git push
          fi
      - name: Package website
        if: steps.report.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    # needs 同時確保 build 成功，並能讀取它的 changed；不獨立猜測是否有新資料。
    if: needs.build.outputs.changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      # Pages 部署權限與短期 OIDC 身分；此 job 不需要 contents: write。
      pages: write
      id-token: write
    environment:
      # 連到 repo 的 Pages 環境及其保護規則，部署 URL 由官方 action 回傳。
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
