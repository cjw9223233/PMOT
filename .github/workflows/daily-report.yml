name: Daily market report and GitHub Pages

on:
  schedule:
    # 三個獨立喚醒機會；GitHub 排程仍可能延遲，不能當作準時保證。
    - cron: '0 8 * * *'
      timezone: Asia/Taipei
    - cron: '17 8 * * *'
      timezone: Asia/Taipei
    - cron: '37 8 * * *'
      timezone: Asia/Taipei
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Who requested this run (label only; does not bypass checks)'
        type: choice
        options: [manual, cloudflare]
        default: manual
      requested_at:
        description: 'External trigger actual UTC request timestamp, if applicable'
        type: string
        required: false
      rebuild_only:
        description: 'Rebuild and publish existing snapshots without querying fresh markets'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'pmot/**'
      - 'site/assets/**'
      - 'site/_headers'
      - 'cloudflare/**'
      - 'site/prompt.md'
      - 'site/data/reports.json'
      - '.github/workflows/daily-report.yml'
      - 'tests/**'

# build 到成功收據提交都序列化；補跑 checkout 時才能看到前次結果。
concurrency:
  group: pmot-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      revision: ${{ steps.publish.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify market parsing and delivery safeguards
        run: python -m unittest discover -s tests -v
      - name: Read actual GitHub run timestamps
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/run.json"
          echo "RUN_CREATED_AT=$(jq -r .created_at "$RUNNER_TEMP/run.json")" >> "$GITHUB_ENV"
          echo "RUN_STARTED_AT=$(jq -r .run_started_at "$RUNNER_TEMP/run.json")" >> "$GITHUB_ENV"
      - name: Decide generate, retry deployment, or skip
        id: prepare
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          EXTERNAL_REQUESTED_AT: ${{ inputs.requested_at }}
          REBUILD_ONLY: ${{ inputs.rebuild_only }}
        run: python -m pmot.delivery prepare
      - name: Save official trading day check for independent monitor
        if: always() && steps.prepare.outcome != 'skipped'
        shell: bash
        run: |
          python -m pmot.delivery checkpoint
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f .pmot/check.json ]; then git add .pmot/check.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record trading day check [skip ci]'
            git push origin HEAD:main
          fi
      - name: Query fresh markets only when no report exists today
        id: query
        if: steps.prepare.outputs.action == 'generate'
        run: python -m pmot update
      - name: Record packaging time and save immutable report
        id: publish
        if: steps.prepare.outputs.action == 'deploy' || steps.query.outputs.changed == 'true'
        shell: bash
        run: |
          python -m pmot.delivery package
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site
          if ! git diff --cached --quiet; then
            git commit -m 'Update premarket report and delivery timing [skip ci]'
            git push origin HEAD:main
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Package website
        if: steps.publish.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Keep timing evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-timing-${{ github.run_attempt }}
          path: delivery-timing.json
          if-no-files-found: ignore
          retention-days: 30
  deploy:
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    if: needs.build.outputs.changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          # 與 Pages artifact 完全相同的 site commit；不拿之後移動的 main 部署資產。
          ref: ${{ needs.build.outputs.revision }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify Cloudflare deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - run: npm ci
        working-directory: cloudflare
      # 單次最多等待 2 分鐘；暫時失敗在同次 run 再試一次。
      - name: Deploy website
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
      - name: Retry website deployment
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
      - name: Deploy same snapshot and Worker to Cloudflare
        id: cloudflare
        continue-on-error: true
        timeout-minutes: 3
        run: npm run deploy
        working-directory: cloudflare
      - name: Retry Cloudflare publication
        if: steps.cloudflare.outcome == 'failure'
        timeout-minutes: 3
        run: npm run deploy
        working-directory: cloudflare
      - name: Verify both public websites against packaged snapshot
        env:
          PUBLICATION_PROOF: ${{ runner.temp }}/publication-proof.json
        run: node cloudflare/scripts/verify-sites.mjs
      - name: Save success receipt only after confirmed deployment
        env:
          PUBLICATION_PROOF: ${{ runner.temp }}/publication-proof.json
        # 任何部署失敗都不會走到這一步；之後補跑將重用相同報告。
        run: |
          # 再核對 main 沒有被較新的內容取代；失敗時不寫成功收據。
          git fetch origin main:refs/remotes/origin/main
          git checkout --detach origin/main
          python -m pmot.delivery confirm --timing site/data/delivery.json --proof "$PUBLICATION_PROOF"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pmot/deployment.json
          git commit -m 'Record confirmed Pages deployment [skip ci]'
          git push origin HEAD:main
