name: Validate source changes
on:
  pull_request:
  push:
    branches: [main]
    paths: ['pmot/**', 'tests/**', '.github/workflows/ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pmot build
