name: Validate source changes
# PR 執行驗證；main 指定程式／測試變更也驗證。這個流程沒有部署工作。
on:
  pull_request:
  push:
    branches: [main]
    paths: ['pmot/**', 'tests/**', 'cloudflare/**', '.github/workflows/ci.yml']
permissions:
  # 檢查來源只需要讀取 repo，不需要寫入報告或 Pages 權限。
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      # 驗證現有清單能重建首頁，不會查詢真實行情或發布到正式網站。
      - run: python -m pmot build
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
        working-directory: cloudflare
      - run: npm test
        working-directory: cloudflare
      # 官方 Wrangler 建置檢查不登入、不建立 Worker、不讀取真實金鑰。
      - run: npm run dry-run
        working-directory: cloudflare
