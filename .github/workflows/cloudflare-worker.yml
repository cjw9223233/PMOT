name: Deploy independent Cloudflare trigger

# 網站、Worker 與 Pages 必須共用同一快照及驗證收據；人工更新也交給每日發布流程。
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  request-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request complete dual-site rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run daily-report.yml --repo "$GITHUB_REPOSITORY" --ref main -f trigger_source=manual -f rebuild_only=true
          echo 'Rebuild requested. Follow Daily market report and GitHub Pages for the actual publication result.' >> "$GITHUB_STEP_SUMMARY"
